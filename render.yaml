services:
  - type: web
    name: rcs-centre-de-formation
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PIN
        sync: false # Render demande la valeur lors de la création
